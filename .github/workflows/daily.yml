name: Daily clip

on:
  schedule:
    - cron: "7 11 * * *"  # 14:07 Mecca time, leaving the afternoon to review before the 20:00 post
  push:
    branches: [main]
    paths: [content/run-now.txt]  # a commit to this file starts a run without opening GitHub
  workflow_dispatch:
    inputs:
      publish_now:
        description: Skip the wait for 20:00 (still only between 13:00 and 22:00 Mecca time)
        type: boolean
        default: false

# A new day's run replaces one that was never approved
concurrency:
  group: daily-clip
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg and the libraries the Remotion browser needs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2t64
      - name: Install Remotion
        working-directory: video
        run: npm ci
      - name: Produce the clip
        run: python3 daily.py build
      - name: Host the clip at a public URL
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="clip-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$tag" out/today.mp4 out/today.txt --title "$tag" --notes "Daily clip" --prerelease
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Send the clip to Telegram for review
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT" ]; then echo "Telegram is not set up, skipping"; exit 0; fi
          link="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -o reply.json -F chat_id="$CHAT" -F video=@out/today_preview.mp4 \
            -F caption="$(cat out/today.txt)

          للموافقة على النشر: $link" "https://api.telegram.org/bot$BOT/sendVideo" || true
          # A failed review message must not stop the run; the clip can still be watched from the release
          python3 -c "import json; d = json.load(open('reply.json')); print('Telegram:', d.get('ok'), d.get('error_code'), d.get('description'))" || true

  approve:
    needs: build
    runs-on: ubuntu-24.04
    environment: instagram  # required reviewer: the run waits here for approval
    steps:
      - name: Wait towards the time slot
        env:
          PUBLISH_NOW: ${{ inputs.publish_now }}
          TZ: Asia/Riyadh
        run: |
          now=$(date +%s)
          open=$(date -d "13:00" +%s); post=$(date -d "20:00" +%s); close=$(date -d "22:00" +%s)
          if [ "$now" -ge "$close" ]; then echo "Approved after 22:00, not posting today"; exit 1; fi
          if [ "$PUBLISH_NOW" = "true" ]; then
            if [ "$now" -lt "$open" ]; then echo "Before 13:00, not posting"; exit 1; fi
            exit 0
          fi
          wait=$((post - now))
          # A job can run for six hours at most, so the publish job waits out whatever is left
          if [ "$wait" -gt 19800 ]; then wait=19800; fi
          if [ "$wait" -gt 0 ]; then echo "Waiting $wait seconds"; sleep "$wait"; fi

  publish:
    needs: [build, approve]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Hold the post for its time slot
        env:
          PUBLISH_NOW: ${{ inputs.publish_now }}
          TZ: Asia/Riyadh
        run: |
          if [ "$PUBLISH_NOW" = "true" ]; then exit 0; fi
          wait=$(($(date -d "20:00" +%s) - $(date +%s)))
          if [ "$wait" -gt 0 ]; then echo "Waiting $wait seconds for 20:00"; sleep "$wait"; fi
      - name: Publish to Instagram
        env:
          GH_TOKEN: ${{ github.token }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern today.txt --dir out
          python3 publish_ig.py "${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/today.mp4" out/today.txt
      - name: Move the queue forward
        run: |
          python3 daily.py advance
          git config user.name "ansit-bot"
          git config user.email "ansit-bot@users.noreply.github.com"
          git add content/state.json
          git commit -m "Published ${{ needs.build.outputs.tag }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Remove the hosted copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ needs.build.outputs.tag }}" --yes --cleanup-tag

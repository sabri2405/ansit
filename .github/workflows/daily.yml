name: Daily clip

on:
  schedule:
    - cron: "17 15 * * *"  # 18:17 Mecca time; the post goes out when the run is approved
  workflow_dispatch:

# A new day's run replaces one that was never approved
concurrency:
  group: daily-clip
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Produce the clip
        run: python3 daily.py build
      - name: Host the clip at a public URL
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="clip-${{ github.run_id }}"
          gh release create "$tag" out/today.mp4 out/today.txt --title "$tag" --notes "Daily clip" --prerelease
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Send the clip to Telegram for review
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT" ]; then echo "Telegram is not set up, skipping"; exit 0; fi
          link="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sSf -o /dev/null -F chat_id="$CHAT" -F video=@out/today_preview.mp4 \
            -F caption="$(cat out/today.txt)

          للموافقة على النشر: $link" "https://api.telegram.org/bot$BOT/sendVideo"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: instagram  # required reviewer: the run waits here for approval
    steps:
      - uses: actions/checkout@v4
      - name: Publish to Instagram
        env:
          GH_TOKEN: ${{ github.token }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern today.txt --dir out
          python3 publish_ig.py "${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/today.mp4" out/today.txt
      - name: Move the queue forward
        run: |
          python3 daily.py advance
          git config user.name "ansit-bot"
          git config user.email "ansit-bot@users.noreply.github.com"
          git add content/state.json
          git commit -m "Published ${{ needs.build.outputs.tag }}"
          git push
      - name: Remove the hosted copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ needs.build.outputs.tag }}" --yes --cleanup-tag

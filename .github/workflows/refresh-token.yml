name: Refresh Instagram token

on:
  schedule:
    - cron: "41 6 1,20 * *"  # twice a month, well inside the 60-day lifetime
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Replace IG_TOKEN with a renewed token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}  # github.token cannot write secrets
        run: |
          new=$(curl -sSf -G "https://graph.instagram.com/refresh_access_token" \
            -d grant_type=ig_refresh_token --data-urlencode "access_token=$IG_TOKEN" | jq -r .access_token)
          echo "::add-mask::$new"
          gh secret set IG_TOKEN --repo "${{ github.repository }}" --body "$new"
